<!-- Fassung 25: Startbild beim Öffnen der App. Steht vor dem großen Spielskript und läuft daher sofort. Alle Bewegungen
     sind CSS-Animationen (transform/opacity) und laufen auf dem Compositor weiter, auch während der Browser das
     Spielskript übersetzt. Je Fraktion fliegen ihre zwei größten Schiffe und ihr kleinstes Kriegsschiff vorbei,
     Startfraktion zufällig. Der Balken folgt dem echten Laden (__bootP / __bootDone aus dem Spiel). -->
<div id="boot" aria-hidden="true">
<style>
#boot { position: fixed; inset: 0; z-index: 99999; overflow: hidden; background-color: #02040a; background-image: radial-gradient(ellipse 70% 60% at 72% 30%, rgba(90,50,150,0.35), rgba(0,0,0,0) 70%), radial-gradient(ellipse 60% 50% at 18% 78%, rgba(30,90,140,0.30), rgba(0,0,0,0) 70%); font-family: 'Barlow Condensed', 'Roboto Condensed', system-ui, sans-serif; color: #dfeaf5; transition: opacity 0.7s; --o: 0s; touch-action: none; user-select: none; -webkit-user-select: none; }
#boot.out { opacity: 0; pointer-events: none; }
#boot .st { position: absolute; left: 0; top: 0; width: 1px; height: 1px; background: transparent; will-change: transform; }
#boot .st1 { box-shadow: {{STARS1}}; animation: bStar 160s linear infinite; opacity: 0.5; }
#boot .st2 { box-shadow: {{STARS2}}; animation: bStar 70s linear infinite; opacity: 0.75; }
#boot .st3 { box-shadow: {{STARS3}}; animation: bStar 26s linear infinite; }
@keyframes bStar { from { transform: translateX(0); } to { transform: translateX(-2000px); } }
#boot .ship { position: absolute; left: 0; will-change: transform; transform: translateX(-130vw); animation-duration: 25s; animation-iteration-count: infinite; animation-timing-function: linear; animation-delay: calc(var(--k) * 5s - var(--o)); }
#boot .ship img { display: block; width: 100%; }
#boot .ship::before { content: ''; position: absolute; left: -9%; top: 18%; bottom: 18%; width: 28%; background: radial-gradient(ellipse 60% 45% at 100% 50%, var(--eg), rgba(0,0,0,0) 72%); filter: blur(5px); animation: bEng 0.14s infinite alternate; }
@keyframes bEng { from { opacity: 0.75; } to { opacity: 1; } }
#boot .b1 { top: 57%; width: min(96vw, 900px); animation-name: bFly1; z-index: 3; filter: drop-shadow(0 12px 30px rgba(0,0,0,0.7)); }
#boot .b2 { top: 5%; width: min(46vw, 440px); animation-name: bFly2; z-index: 1; filter: brightness(0.62) saturate(0.85); }
#boot .s1 { top: 30%; width: min(22vw, 200px); animation-name: bFly3; z-index: 2; }
/* je 25 s Zyklus: die eigene Fraktion fliegt in den ersten 5 s (20 %), danach außer Sicht */
@keyframes bFly1 { 0% { transform: translateX(-105%) translateY(2vh); } 21% { transform: translateX(110vw) translateY(-3vh); } 21.01%, 100% { transform: translateX(-130vw); } }
@keyframes bFly2 { 0% { transform: translateX(-110%); } 21% { transform: translateX(110vw) translateY(-1vh); } 21.01%, 100% { transform: translateX(-130vw); } }
@keyframes bFly3 { 0%, 5% { transform: translateX(-110%); } 15% { transform: translateX(115vw) translateY(-4vh); } 15.01%, 100% { transform: translateX(-130vw); } }
#boot .fl { position: absolute; left: max(18px, env(safe-area-inset-left)); bottom: max(16px, env(safe-area-inset-bottom)); z-index: 6; opacity: 0; animation: bLab 25s infinite linear; animation-delay: calc(var(--k) * 5s - var(--o)); text-transform: uppercase; }
#boot .fl b { display: block; font-size: 15px; letter-spacing: 0.32em; color: var(--fc); font-weight: 700; }
#boot .fl small { display: block; font-size: 12px; letter-spacing: 0.18em; color: #8ea4b6; margin-top: 2px; }
@keyframes bLab { 0% { opacity: 0; } 3% { opacity: 1; } 17% { opacity: 1; } 20%, 100% { opacity: 0; } }
#boot .vg { position: absolute; inset: 0; z-index: 4; background: radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 38%, rgba(0,0,0,0.72)); pointer-events: none; }
#boot .mid { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); z-index: 5; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
#boot .ic { width: 104px; height: 104px; border-radius: 24px; opacity: 0; animation: bIn 0.9s 0.15s forwards, bPulse 3s 1.1s ease-in-out infinite; }
#boot .tt { text-transform: uppercase; font-size: clamp(26px, 6vw, 46px); font-weight: 700; letter-spacing: 0.32em; padding-left: 0.32em; color: #fff; white-space: nowrap; opacity: 0; animation: bIn 0.9s 0.5s forwards; text-shadow: 0 0 24px rgba(143,227,255,0.35); }
@keyframes bIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
@keyframes bPulse { 0%, 100% { box-shadow: 0 0 0 1px rgba(143,227,255,0.35), 0 0 28px rgba(143,227,255,0.3); } 50% { box-shadow: 0 0 0 1px rgba(143,227,255,0.6), 0 0 60px rgba(143,227,255,0.6); } }
#boot .lo { position: absolute; left: 50%; bottom: max(9vh, 64px); transform: translateX(-50%); width: min(420px, 74vw); z-index: 6; padding: 10px 14px; border-radius: 10px; background: rgba(2,4,10,0.55); }
#boot .bar { height: 4px; border-radius: 2px; background: rgba(143,227,255,0.14); overflow: hidden; }
#boot .bar i { display: block; height: 100%; width: 100%; transform-origin: 0 50%; transform: scaleX(0.04); background: linear-gradient(90deg, #4fb7e6, #bff2ff); box-shadow: 0 0 12px #8fe3ff; animation: bFill 3.2s 0.2s cubic-bezier(.2,.7,.3,1) forwards; }
@keyframes bFill { to { transform: scaleX(0.72); } }
#boot .row { display: flex; justify-content: space-between; margin-top: 7px; font-size: 14px; letter-spacing: 0.14em; color: #8fb6c9; text-transform: uppercase; }
#boot .row span:last-child { font-variant-numeric: tabular-nums; }
@media (max-aspect-ratio: 1/1) { #boot .b1 { top: 62%; width: 128vw; } #boot .b2 { top: 12%; width: 70vw; } #boot .s1 { top: 24%; width: 34vw; } #boot .mid { top: 40%; } }
@media (prefers-reduced-motion: reduce) { #boot .ship, #boot .st { animation-duration: 0s !important; } }
</style>
<div class="st st1"></div><div class="st st2"></div><div class="st st3"></div>
{{FACTIONS}}
<div class="vg"></div>
<div class="mid"><img class="ic" src="{{IMG:icon}}" alt=""><div class="tt">Rift Armada</div></div>
<div class="lo"><div class="bar"><i id="bootBar"></i></div><div class="row"><span id="bootTxt"></span><span id="bootPct"></span></div></div>
<script>
(function () {
  var B = document.getElementById('boot'); if (!B) return;
  /* Prüfläufe: kein Startbild */
  if (window.__RA_TEST) { B.parentNode.removeChild(B); window.__bootP = window.__bootDone = function () {}; return; }
  var lang = 'en'; try { var pr = JSON.parse(localStorage.getItem('ra.prefs') || '{}'); lang = (pr.set && pr.set.lang) || (navigator.language || 'en').slice(0, 2); } catch (e) { lang = (navigator.language || 'en').slice(0, 2); }
  var TX = { de: ['Flotte sammelt sich …', 'Systeme laden …', 'Bereit'], en: ['Fleet assembling …', 'Loading systems …', 'Ready'], fr: ['La flotte se rassemble …', 'Chargement des systèmes …', 'Prêt'], es: ['La flota se reúne …', 'Cargando sistemas …', 'Listo'], it: ['La flotta si raduna …', 'Caricamento sistemi …', 'Pronto'], pt: ['A frota se reúne …', 'Carregando sistemas …', 'Pronto'], pl: ['Flota się zbiera …', 'Ładowanie systemów …', 'Gotowe'] }[lang] || ['Fleet assembling …', 'Loading systems …', 'Ready'];
  var t0 = Date.now(), MIN = 3800, ready = false, gone = false, bar = document.getElementById('bootBar'), txt = document.getElementById('bootTxt'), pct = document.getElementById('bootPct');
  /* zufällige Startfraktion: Zyklus so verschieben, dass sie sofort fliegt */
  B.style.setProperty('--o', (Math.floor(Math.random() * 5) * 5) + 's');
  txt.textContent = TX[0];
  var shown = 0.04, tick = setInterval(function () { if (ready) return; var p = Math.min(0.7, 0.04 + (Date.now() - t0) / 3400 * 0.66); if (p > shown) { shown = p; pct.textContent = Math.round(p * 100) + ' %'; } }, 120);
  function set(p) { bar.style.animation = 'none'; bar.style.transition = 'transform 0.4s ease-out'; bar.style.transform = 'scaleX(' + Math.max(shown, p) + ')'; shown = Math.max(shown, p); pct.textContent = Math.round(shown * 100) + ' %'; }
  /* nach dem Start bleibt das Bild verborgen im Dokument: der Ladebildschirm vor Gefechten nutzt es wieder (__bootShow) */
  function leave() { if (gone) return; gone = true; clearInterval(tick); B.classList.add('out'); setTimeout(function () { if (gone) B.style.display = 'none'; }, 750); }
  var groups = Array.prototype.slice.call(B.querySelectorAll('.fg')), cyc = null;
  function replay(g) { var els = g.querySelectorAll('.ship,.fl'); for (var i = 0; i < els.length; i++) { els[i].style.animation = 'none'; void els[i].offsetWidth; els[i].style.animation = ''; } }
  /* Ladebildschirm vor einer Partie: nur die Fraktionen der Partie, je 5 s eine, Balken von außen */
  window.__bootShow = function (facs, text) {
    if (gone === false && !ready) return false;
    var list = groups.filter(function (g) { return facs.indexOf(g.getAttribute('data-f')) >= 0; }); if (!list.length) list = groups;
    B.style.setProperty('--o', '0s'); groups.forEach(function (g) { g.style.display = 'none'; g.style.setProperty('--k', '0'); });
    var i = 0; function next() { list.forEach(function (g) { g.style.display = 'none'; }); var g = list[i++ % list.length]; g.style.display = ''; replay(g); }
    next(); clearInterval(cyc); cyc = setInterval(next, 5200);
    gone = false; ready = true; B.style.transition = 'none'; B.classList.remove('out'); B.style.display = ''; void B.offsetWidth; B.style.transition = '';   /* sofort deckend – das Vorbereiten blockiert gleich danach den Hauptfaden */
    txt.textContent = text || TX[1]; shown = 0; set(0.02);
  };
  window.__bootSet = function (p) { set(Math.max(0.02, Math.min(1, p))); };
  window.__bootHide = function () { clearInterval(cyc); leave(); };
  window.__bootP = function (p) { if (!gone) { set(p); txt.textContent = TX[1]; } };
  window.__bootDone = function () { if (gone) return; ready = true; set(1); txt.textContent = TX[2]; setTimeout(leave, Math.max(250, MIN - (Date.now() - t0))); };
  /* nach dem Laden: Antippen überspringt die Wartezeit */
  B.addEventListener('pointerdown', function () { if (ready && !cyc) leave(); });
  /* Notausgang, falls das Spiel nie »fertig« meldet */
  setTimeout(function () { if (!gone) leave(); }, 25000);
})();
</script>
</div>
