# Baut die Android-App (Play-Store-Datei .aab und Test-Datei .apk) aus dem Spiel.
# Läuft bei jedem Hochladen auf »main« und auf Knopfdruck (Actions → »Android-App bauen« → Run workflow).
# Geheimnisse (Settings → Secrets and variables → Actions): RA_KEYSTORE_BASE64, RA_KEYSTORE_PASSWORD,
# RA_KEY_ALIAS, RA_KEY_PASSWORD. Ohne sie entsteht nur eine Test-App (mit dem Entwicklungsschlüssel signiert).
name: Android-App bauen

on:
  push:
    branches: [main]
    paths: ['src/**', 'app/**', 'tools/build.py', 'VERSION', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Versionsname, z. B. 1.0.0 (leer: 0.<Fassung>.<Laufnummer>)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Das Android-SDK ist auf den GitHub-Rechnern vorinstalliert (ANDROID_HOME); fehlende Teile lädt Gradle selbst.
      - name: Android-SDK prüfen
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Spiel bauen (eine HTML-Datei)
        run: python3 tools/build.py

      - name: App-Hülle vorbereiten
        working-directory: app
        run: |
          npm ci
          node copy-web.js
          npx cap sync android

      - name: Signaturschlüssel bereitstellen
        env:
          KS: ${{ secrets.RA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "RA_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Schlüssel vorhanden: Die App wird signiert."
          else
            echo "::warning::Kein Signaturschlüssel hinterlegt – es entsteht nur eine Test-App, nicht für den Play Store."
          fi

      - name: App bauen
        working-directory: app/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME_IN: ${{ inputs.version_name }}
          RA_KEYSTORE_PASSWORD: ${{ secrets.RA_KEYSTORE_PASSWORD }}
          RA_KEY_ALIAS: ${{ secrets.RA_KEY_ALIAS }}
          RA_KEY_PASSWORD: ${{ secrets.RA_KEY_PASSWORD }}
        run: |
          FASSUNG=$(cat "$GITHUB_WORKSPACE/VERSION")
          export VERSION_NAME="${VERSION_NAME_IN:-0.$FASSUNG.$VERSION_CODE}"
          chmod +x gradlew
          mkdir -p "$GITHUB_WORKSPACE/out"
          if [ -n "$RA_KEYSTORE" ]; then
            ./gradlew --no-daemon bundleRelease assembleRelease
            cp app/build/outputs/bundle/release/*.aab "$GITHUB_WORKSPACE/out/Rift-Armada-$VERSION_NAME.aab"
            cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/out/Rift-Armada-$VERSION_NAME.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/out/Rift-Armada-$VERSION_NAME-test.apk"
          fi
          cp "$GITHUB_WORKSPACE/build/rift-armada.html" "$GITHUB_WORKSPACE/out/Rift-Armada-$FASSUNG.html"
          echo "Version $VERSION_NAME (Code $VERSION_CODE, Fassung $FASSUNG)" > "$GITHUB_WORKSPACE/out/VERSION.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: Rift-Armada-App-${{ github.run_number }}
          path: out/
          retention-days: 30
