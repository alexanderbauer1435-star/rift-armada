# Veröffentlicht die Datenschutzerklärung (für den Play Store nötig) und die Browser-Fassung des Spiels über GitHub Pages.
# Einmalig einschalten: Settings → Pages → Source: »GitHub Actions«. Adresse danach:
#   https://<konto>.github.io/rift-armada/datenschutz.html   (Datenschutz)
#   https://<konto>.github.io/rift-armada/                   (Spiel im Browser)
name: Webseite (Datenschutz und Spiel)
on:
  push:
    branches: [main]
    paths: ['store/**', 'src/**', 'tools/build.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      # Ohne eingeschaltete Pages (Settings → Pages → Source: GitHub Actions) nur ein Hinweis statt eines Fehlers
      - name: Pages eingeschaltet?
        id: on
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          if gh api "repos/${{ github.repository }}/pages" > /dev/null 2>&1; then echo "ok=1" >> "$GITHUB_OUTPUT";
          else echo "::warning::GitHub Pages ist noch nicht eingeschaltet: Settings → Pages → Source »GitHub Actions« wählen, dann diesen Ablauf erneut starten."; echo "ok=0" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v5
        if: steps.on.outputs.ok == '1'
      - name: Seite zusammenstellen
        if: steps.on.outputs.ok == '1'
        run: |
          python3 tools/build.py
          mkdir -p site
          cp build/Rift-Armada-*.html site/index.html
          cp store/datenschutz.html site/datenschutz.html
          cp store/datenschutz.html site/privacy.html
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
        if: steps.on.outputs.ok == '1'
      - uses: actions/upload-pages-artifact@v3
        if: steps.on.outputs.ok == '1'
        with: { path: site }
      - id: d
        if: steps.on.outputs.ok == '1'
        uses: actions/deploy-pages@v4
