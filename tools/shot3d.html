<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<title>Rift Armada – 3D-Prüfseite</title>
<style>
html,body{margin:0;height:100%;background:#04060d;overflow:hidden;font:600 13px/1.3 "Barlow Condensed",system-ui,sans-serif;color:#e8eef8}
#view3d,#view{position:fixed;inset:0;width:100%;height:100%;display:block}
#view{pointer-events:none}
#hud{position:fixed;left:8px;top:8px;background:rgba(6,10,24,.72);border:1px solid #22355c;border-radius:8px;padding:6px 9px;pointer-events:none;white-space:pre}
</style></head><body>
<canvas id="view3d"></canvas>
<canvas id="view"></canvas>
<div id="hud"></div>
<!-- Simulation in der Reihenfolge von tests/harness.js (ohne Missionen und Feldzug) -->
<script src="../src/core.js"></script><script src="../src/data.js"></script><script src="../src/i18n.js"></script><script src="../src/i18n_en.js"></script>
<script src="../src/map.js"></script><script src="../src/mapview.js"></script><script src="../src/sim.js"></script><script src="../src/combat.js"></script>
<script src="../src/ai.js"></script><script src="../src/waves.js"></script>
<script src="../src/render3d.js"></script>
<script>
/* Prüfseite: Partie anlegen, Schiffe und Stationen aller Fraktionen einsetzen, laufen lassen, über RA3D zeichnen.
   T3.setup() → T3.step(n) → T3.render(cx, cy, zoom, opts) → T3.cross() zeichnet Kreuze an project(u.x, u.y). */
const T3 = { g: null, view: null, time: 0, fogCv: null, fogImg: null, vp: 0, last: null };
function pcol(o) { const p = T3.g.players[o]; return p ? (p.color || p.F.team) : '#d8d0bd'; }
function fogUpdate() {
  const g = T3.g, vp = T3.vp; if (vp < 0) return null;
  const p = g.players[vp], d = T3.fogImg.data, n = g.vw * g.vh, st = g.visStamp, vis = p.vis, ex = p.explored;
  for (let i = 0; i < n; i++) { const o = i * 4; d[o] = 2; d[o + 1] = 3; d[o + 2] = 8; d[o + 3] = vis[i] === st ? 0 : ex[i] ? 120 : 235; }
  T3.fogCv.getContext('2d').putImageData(T3.fogImg, 0, 0); return T3.fogCv;
}
T3.setup = function (opts) {
  opts = opts || {};
  const g = createGame({ map: opts.map || 'haven', players: [{ faction: 'alliance', human: true }, { faction: 'brood', ai: 2 }], seed: opts.seed || 3 });
  T3.g = g; T3.vp = opts.vp === undefined ? 0 : opts.vp;
  T3.fogCv = document.createElement('canvas'); T3.fogCv.width = g.vw; T3.fogCv.height = g.vh; T3.fogImg = T3.fogCv.getContext('2d').createImageData(g.vw, g.vh);
  const me = g.players[0], s = me.start, dir = s.ang, foe = g.players[1];
  /* eigene Basis ausbauen: Werft III mit Warteschlange, Labor, Reaktoren, Türme, Schildstation, Superwaffe, eine Baustelle */
  const put = (role, owner, ox, oy, lv, done) => { const b = addBldg(g, role, owner, g.players[owner].start.x + ox, g.players[owner].start.y + oy, done !== false); b.lv = lv || 1; const l = lvOf(b); b.hull = b.hullMax = l.hull; b.shieldMax = l.shield; b.shield = l.shield; if (l.wpn) b.wcd = l.wpn.map(() => 0); if (done === false) { b.done = false; b.prog = 0.45; b.hull = l.hull * 0.5; } return b; };
  const base = g.bldgs.find(b => b.owner === 0 && b.role === 'base'); base.lv = 3; { const l = lvOf(base); base.hull = base.hullMax = l.hull; base.wcd = l.wpn.map(() => 0); }
  const yard = put('yard', 0, Math.cos(dir + 2.2) * 240, Math.sin(dir + 2.2) * 240, 3); yard.q = [{ id: 'bulwark', t: 20 }]; yard.qp = 0.6;
  put('lab', 0, Math.cos(dir - 2.2) * 240, Math.sin(dir - 2.2) * 240, 2);
  put('reactor', 0, Math.cos(dir + 2.9) * 300, Math.sin(dir + 2.9) * 300, 2); put('reactor', 0, Math.cos(dir - 2.9) * 310, Math.sin(dir - 2.9) * 310, 1);
  put('relay', 0, Math.cos(dir + 1.4) * 330, Math.sin(dir + 1.4) * 330, 1);
  put('turret', 0, Math.cos(dir + 0.4) * 300, Math.sin(dir + 0.4) * 300, 2); put('turret', 0, Math.cos(dir - 0.6) * 320, Math.sin(dir - 0.6) * 320, 3);
  put('shield', 0, Math.cos(dir + 0.9) * 200, Math.sin(dir + 0.9) * 200, 1);
  const sup = put('super', 0, Math.cos(dir - 1.5) * 360, Math.sin(dir - 1.5) * 360, 1); sup.charge = 0.7;
  put('turret', 0, Math.cos(dir + 0.1) * 420, Math.sin(dir + 0.1) * 420, 1, false);
  /* eigene Flotte: Alliance-Schiffe aller Größen und ein paar Jäger */
  const mine = ['lancer', 'wren', 'bulwark', 'haven', 'aegis', 'beacon', 'reckoning', 'archipelago', 'fighter', 'fighter', 'fighter', 'fighter'];
  mine.forEach((id, i) => { const a = dir + (i - 5.5) * 0.22, d = 260 + (i % 3) * 70; const u = addShip(g, id, 0, s.x + Math.cos(a) * d, s.y + Math.sin(a) * d, dir); u.o = { t: 'hold' }; u.hold = true; });
  /* Gegner (Brood) bekommt Nest und Schiffe; dazu Gäste der anderen Fraktionen als Zielscheiben beim Gegner */
  const fs = foe.start, fd = fs.ang;
  put('yard', 1, Math.cos(fd + 2) * 220, Math.sin(fd + 2) * 220, 2); put('turret', 1, Math.cos(fd) * 230, Math.sin(fd) * 230, 1); put('spore', 1, Math.cos(fd - 1.2) * 260, Math.sin(fd - 1.2) * 260, 1);
  ['swarm', 'spitter', 'ravager', 'leviathan', 'acidmaw', 'larva'].forEach((id, i) => { const a = fd + (i - 2.5) * 0.3; addShip(g, id, 1, fs.x + Math.cos(a) * 300, fs.y + Math.sin(a) * 300, fd); });
  /* Kampf: Gegnerflotte vor der eigenen Basis (sichtbar), bewegt sich hinein */
  const ax = s.x + Math.cos(dir) * 760, ay = s.y + Math.sin(dir) * 760;
  ['ravager', 'ravager', 'spitter', 'swarm', 'swarm', 'leviathan', 'leech'].forEach((id, i) => { const a = dir + Math.PI + (i - 3) * 0.25; const u = addShip(g, id, 1, ax + Math.cos(a) * 120, ay + Math.sin(a) * 120, dir + Math.PI); u.o = { t: 'amove', x: s.x, y: s.y }; });
  /* Gastschiffe weiterer Fraktionen (Mars, Legion, Nexus) als neutrale Flotte des Gegners südlich der Basis */
  ['olympus', 'hammer', 'needle', 'paladin', 'cherub', 'monolith', 'shard', 'prism'].forEach((id, i) => { const u = addShip(g, id, 1, s.x - 420 + i * 110, s.y + 520, -Math.PI / 2); u.o = { t: 'hold' }; u.hold = true; });
  /* ein Wrack und ein Derelict */
  const der = addShip(g, 'bulwark', 1, s.x + 150, s.y + 420, 1.0); der.derelict = true; der.o = { t: 'hold' }; der.hold = true;
  g.wrecks.push({ x: s.x - 200, y: s.y + 380, ang: 0.6, type: 'lancer', owner: 1, until: g.time + 60, id: 9999 });
  for (const p of g.players) { recalcPower(g, p.id); recalcCp(g, p.id); }
  updateVision(g);
  T3.view = { vp: T3.vp, seen: (x, y) => { if (T3.vp < 0) return true; const p = g.players[T3.vp]; return !!p.explored[clamp((y / VIS) | 0, 0, g.vh - 1) * g.vw + clamp((x / VIS) | 0, 0, g.vw - 1)]; }, visible: e => T3.vp < 0 || canSee(g, T3.vp, e), pcol, fog: null, detail: 1 };
  RA3D.setGame(g, T3.vp);
  return { base: { x: s.x, y: s.y, ang: dir }, yard: { x: yard.x, y: yard.y }, fight: { x: s.x + Math.cos(dir) * 450, y: s.y + Math.sin(dir) * 450 }, foe: { x: fs.x, y: fs.y }, guests: { x: s.x - 50, y: s.y + 520 } };
};
T3.step = function (n) { const g = T3.g; for (let i = 0; i < n; i++) { stepGame(g); for (const e of g.ev) RA3D.event(e, g); g.ev.length = 0; } };
T3.setVp = function (vp) { T3.vp = vp; T3.view.vp = vp; };
/* ein Bild: Kamera setzen, einige Frames laufen lassen (Animation, Effekte), Messwerte merken */
T3.render = function (cx, cy, zoom, opts) {
  opts = opts || {};
  const cv = document.getElementById('view3d'), W = innerWidth, H = innerHeight, dpr = opts.dpr || 1;
  RA3D.resize(W, H, dpr); if (opts.detail !== undefined) { T3.view.detail = opts.detail; RA3D.setDetail(opts.detail); }
  const frames = opts.frames || 3, dt = 1 / 60; let t0 = performance.now();
  for (let i = 0; i < frames; i++) {
    T3.time += dt; if (opts.tick) T3.step(1);
    T3.view.fog = fogUpdate();
    RA3D.setCam(cx, cy, zoom, W, H, dpr);
    if (opts.extra) opts.extra();
    RA3D.frame(T3.g, dt, T3.time, T3.view);
  }
  const ms = (performance.now() - t0) / frames, st = RA3D.stats();
  T3.last = Object.assign({ ms: +ms.toFixed(2), zoom, cx, cy, W, H }, st);
  document.getElementById('hud').textContent = opts.hud === false ? '' : `zoom ${zoom}  calls ${st.calls}  tris ${st.tris}  ${ms.toFixed(1)} ms/frame  Vorlagen ${st.tpl} Sets ${st.sets} Stationen ${st.stations}`;
  return T3.last;
};
/* Kreuze an project(u.x, u.y) aller sichtbaren Schiffe (und Kreise an Stationen) über das 3D-Bild */
T3.cross = function (on) {
  const cv = document.getElementById('view'), W = innerWidth, H = innerHeight; cv.width = W; cv.height = H; const x = cv.getContext('2d'); x.clearRect(0, 0, W, H);
  if (!on) return;
  x.lineWidth = 1.5;
  for (const u of T3.g.ships) { if (u.dead || !T3.view.visible(u)) continue; const p = RA3D.project(u.x, u.y); if (!p) continue; x.strokeStyle = '#ff2a2a'; x.beginPath(); x.moveTo(p.x - 7, p.y); x.lineTo(p.x + 7, p.y); x.moveTo(p.x, p.y - 7); x.lineTo(p.x, p.y + 7); x.stroke(); x.strokeStyle = 'rgba(255,255,255,0.5)'; x.beginPath(); x.arc(p.x, p.y, u.def.r * p.s, 0, 6.2832); x.stroke(); }
  for (const b of T3.g.bldgs) { if (b.dead || !T3.view.seen(b.x, b.y)) continue; const p = RA3D.project(b.x, b.y); if (!p) continue; x.strokeStyle = '#2aff6a'; x.beginPath(); x.arc(p.x, p.y, b.def.r * p.s, 0, 6.2832); x.stroke(); }
};
/* Hin- und Rückrechnung prüfen: Bildschirm → Welt → Bildschirm */
T3.checkProj = function () {
  let worst = 0; const W = innerWidth, H = innerHeight;
  for (const [sx, sy] of [[W / 2, H / 2], [10, 10], [W - 10, H - 10], [W / 2, H - 5], [W * 0.2, H * 0.8]]) { const w = RA3D.unproject(sx, sy), p = RA3D.project(w.x, w.y); if (!p) { worst = 1e9; continue; } worst = Math.max(worst, Math.hypot(p.x - sx, p.y - sy)); }
  return worst;
};
window.T3 = T3;
</script>
</body></html>
